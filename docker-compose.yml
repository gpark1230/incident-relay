services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: incident_relay
      POSTGRES_PASSWORD: incident_relay
      POSTGRES_DB: incident_relay
    ports:
      - "5433:5432"
    volumes:
      - incident_relay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_relay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://incident_relay:incident_relay@postgres:5432/incident_relay
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://incident_relay:incident_relay@postgres:5432/incident_relay
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  listener:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://incident_relay:incident_relay@postgres:5432/incident_relay
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.listener"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  incident_relay_pgdata:
